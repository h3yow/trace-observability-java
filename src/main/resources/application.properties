# ============================================================
# 服务
# ============================================================
server.port=8080
spring.application.name=trace-observability-java

# ============================================================
# 日志：控制台 pattern 显式携带 MDC 中的 traceId/spanId，
# 与内存 appender 收集的结构化字段同源，便于人工核对。
# ============================================================
logging.pattern.level=%5p [traceId=%X{traceId:-}, spanId=%X{spanId:-}]

# ============================================================
# 可观测性可配置项（observability.*）
# ------------------------------------------------------------
# enabled                 总开关（预留）
# store-capacity          内存中保留的链路条数上限（超出淘汰最旧）
# log-buffer-capacity     内存结构化日志环形缓冲条数
# async-pool-size         传播上下文的业务线程池大小
# dependency-timeout-millis 演示接口默认依赖超时预算
# ============================================================
observability.enabled=true
observability.store-capacity=10000
observability.log-buffer-capacity=2000
observability.async-pool-size=4
observability.dependency-timeout-millis=200
