# ===== 可观测性配置（前缀 observability）=====
# 读取/回写上游 traceId 的请求头名
observability.trace-header=X-Trace-Id
# 合法 traceId 的正则：缺失或不匹配时服务端生成新标识
observability.trace-id-pattern=^[0-9a-fA-F]{16,32}$
# 服务端生成 traceId 的十六进制长度（会被夹在 16~32 以保证合法）
observability.trace-id-length=32
# 传播追踪上下文的工作线程池大小
observability.async-pool-size=8
# 进程内保留的观测明细条数上限（计数指标不受影响）
observability.max-observations=1000
# 每个耗时样本集（各归类 + 整体）的蓄水池容量上限：超出后等概率替换（无偏采样），内存恒定
observability.latency-sample-capacity=2048

server.port=8080
spring.application.name=trace-observability-java
